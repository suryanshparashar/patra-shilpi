[project]
name = "agents"
version = "0.1.0"
description = "LangGraph supervisor + LangChain agents for resume customization"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-google-genai>=3.0",
    "langsmith>=0.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents"]
