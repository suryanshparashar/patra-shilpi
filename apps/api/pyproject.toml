[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend for the Resume Customizer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "pdfplumber>=0.11",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "db",
    "agents",
]

[project.scripts]
# Dev server: `uv run --package api dev`
dev = "api.cli:dev"

[tool.uv.sources]
db = { workspace = true }
agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
