<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1917"/>
      <stop offset="1" stop-color="#0c0a09"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g transform="translate(-3 -30.5)">
    <!-- The P: every outer corner uses the same 24-unit radius. Its counter (the hole in the bowl) is cut as a document with a folded corner. -->
    <path fill="#fafaf9" fill-rule="evenodd" d="
      M150 126 A24 24 0 0 1 174 102 H344 A24 24 0 0 1 368 126 V306 A24 24 0 0 1 344 330 H206 V443 A28 28 0 0 1 150 443 Z
      M214 142 H268 L328 202 V282 Q328 290 320 290 H214 Q206 290 206 282 V150 Q206 142 214 142 Z"/>

    <!-- The dog-ear: the corner of the document, folded down -->
    <path d="M268 154 V194 Q268 202 276 202 H316 Z"
          fill="#10b981" stroke="#10b981" stroke-width="8" stroke-linejoin="round"
          filter="url(#glow)"/>
  </g>
</svg>
